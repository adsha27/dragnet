[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragnet"
version = "0.1.0"
description = "Remote-job acquisition system: India → US remote, $5k+/mo"
requires-python = ">=3.12"
dependencies = [
    # LLM
    "anthropic>=0.40.0",
    # Search
    "exa-py>=1.8.0",
    # Browser automation
    "stagehand>=0.1.0",
    "playwright>=1.49.0",
    # Web framework + server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    # HTTP
    "httpx>=0.28.0",
    # Scheduling
    "apscheduler>=3.10.4",
    # Gmail
    "google-auth>=2.38.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.160.0",
    # YAML
    "pyyaml>=6.0.2",
    # CLI
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
dragnet = "dragnet.cli:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
